name: New Post
on:
  workflow_dispatch:
    inputs:
      title:
        description: "Post Title"
        required: true
      slug:
        description: "Custom slug (optional, lowercase-dashes)"
        required: false
permissions:
  contents: write

concurrency:
  group: site-content-${{ github.ref }}
  cancel-in-progress: false

jobs:
  make:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Create post
        env:
          TITLE: ${{ github.event.inputs.title }}
          SLUG: ${{ github.event.inputs.slug }}
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          if [ -z "$SLUG" ]; then
            SLUG=$(printf '%s' "$TITLE" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9 ]/-/g' -e 's/--*/-/g' -e 's/^-//' -e 's/-$//')
          fi
          if [[ "$SLUG" == *$'\n'* || "$SLUG" == *$'\r'* || ! "$SLUG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "Slug must contain lowercase letters, digits, and single dashes only." >&2
            exit 1
          fi
          mkdir -p posts
          FILE="posts/${SLUG}.md"
          if [ -e "$FILE" ]; then
            echo "A post with this slug already exists." >&2
            exit 1
          fi
          echo "POST_FILE=$FILE" >> "$GITHUB_ENV"
          sed "s/{{DATE}}/${DATE}/" posts/_template.md > "$FILE"
          python3 - "$TITLE" "$FILE" <<'PY'
          import json, pathlib, sys
          title, path = sys.argv[1], sys.argv[2]
          p = pathlib.Path(path)
          p.write_text(
              p.read_text().replace('title: "Your Title"', 'title: ' + json.dumps(title, ensure_ascii=False))
          )
          PY
          echo "Created $FILE"
      - name: Commit
        env:
          TITLE: ${{ github.event.inputs.title }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -- "$POST_FILE"
          if git diff --cached --quiet; then
            echo "The requested post produced no staged changes." >&2
            exit 1
          fi
          git commit -m "new post"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
