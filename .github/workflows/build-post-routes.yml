name: Build site
on:
  push:
    branches:
      - main
    paths:
      - 'posts/**'
      - 'data/projects.json'
      - 'data/bookmarks.json'
      - 'scripts/build_site.py'
      - 'scripts/post_template.html'
      - 'scripts/requirements.txt'
  workflow_dispatch:
concurrency:
  group: site-content-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: pip install --require-hashes -r scripts/requirements.txt
      - name: Render posts and post lists
        run: python3 scripts/build_site.py
      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -- writing/ bookmarks/index.html index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "auto: rebuild rendered posts and post lists"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin HEAD:main
          fi
